name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # One job: every check takes seconds, so parallel jobs only add setup time.
  # `!cancelled()` keeps later checks running after a failure, so one run reports everything.
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.9"
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.17.1"
          terraform_wrapper: false
      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: v0.65.0

      - name: Install app
        working-directory: app
        run: uv sync --frozen
      - name: ruff
        if: ${{ !cancelled() }}
        working-directory: app
        run: |
          uv run ruff check . ../tools
          uv run ruff format --check . ../tools
      - name: pytest app
        if: ${{ !cancelled() }}
        working-directory: app
        run: uv run pytest -q
      - name: pytest canary logic
        if: ${{ !cancelled() }}
        working-directory: app
        run: uv run pytest -q ../tools/tests
      - name: prettier (Markdown, YAML, JSON, JS)
        if: ${{ !cancelled() }}
        run: npx --yes prettier@3.9.10 --check .
      - name: shellcheck
        if: ${{ !cancelled() }}
        run: shellcheck tools/*.sh
      - name: terraform fmt, validate, test
        if: ${{ !cancelled() }}
        run: tools/tf-check.sh
      - name: tflint
        if: ${{ !cancelled() }}
        env:
          GITHUB_TOKEN: ${{ github.token }} # avoids API rate limits when downloading the ruleset
        run: |
          tflint --init
          tflint --recursive --config "$GITHUB_WORKSPACE/.tflint.hcl"
      - name: checkov
        if: ${{ !cancelled() }}
        run: uvx checkov==3.4.3 --config-file .checkov.yaml
