name: deploy

# Copy a signed image into the environment's Artifact Registry by digest, deploy it as a
# no-traffic revision and run the canary. Called by image.yml on release tags (dev) and by
# promote.yml (prod); can be dispatched by hand to replay a release with injected faults.
on:
  workflow_call:
    inputs:
      image: { type: string, required: true, description: "image@sha256 to deploy" }
      version: { type: string, required: true }
      environment: { type: string, default: dev }
      load:
        {
          type: boolean,
          default: true,
          description: "run k6 against the service during the canary",
        }
      fault_error_rate: { type: string, default: "0" }
      fault_latency_ms: { type: string, default: "0" }
  workflow_dispatch:
    inputs:
      image: { type: string, required: true, description: "image@sha256 to deploy" }
      version: { type: string, required: true }
      environment: { type: choice, options: [dev], default: dev }
      load: { type: boolean, default: true }
      fault_error_rate:
        { type: string, default: "0", description: "0..1, simulates a degraded model" }
      fault_latency_ms: { type: string, default: "0", description: "extra latency per request" }

permissions:
  contents: read

jobs:
  config:
    runs-on: ubuntu-24.04
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - id: check
        env:
          PROJECT: ${{ inputs.environment == 'prod' && vars.GCP_PROJECT_PROD || vars.GCP_PROJECT_DEV }}
        run: |
          if [[ -z $PROJECT ]]; then
            echo "::notice title=deploy skipped::GCP repository variables are not set (see README, Deploying to GCP)."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

  canary:
    needs: config
    if: needs.config.outputs.enabled == 'true'
    runs-on: ubuntu-24.04
    environment: ${{ inputs.environment }}
    concurrency:
      group: deploy-${{ inputs.environment }}
      cancel-in-progress: false
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write # Workload Identity Federation
      packages: read # pull from GHCR
    env:
      SERVICE: model-server
      IMAGE: ${{ inputs.image }}
      VERSION: ${{ inputs.version }}
      FAULT_ERROR_RATE: ${{ inputs.fault_error_rate }}
      FAULT_LATENCY_MS: ${{ inputs.fault_latency_ms }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Guard
        run: |
          if [[ ${{ inputs.environment }} == prod && ($FAULT_ERROR_RATE != 0 || $FAULT_LATENCY_MS != 0) ]]; then
            echo "::error::fault injection is not allowed in prod"; exit 1
          fi

      - uses: ./.github/actions/gcp-auth
        with:
          environment: ${{ inputs.environment }}
          identity: deployer
          vars: ${{ toJSON(vars) }}

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.4
      - uses: imjasonh/setup-crane@feee3b6bb0d4c68370f256a4502498c9227e5c6b # v0.7
        with:
          version: v0.22.1
      - uses: grafana/setup-k6-action@43b9fc21641a76002687994433dd586f56e791b1 # v1.2.2
        with:
          k6-version: "1.8.2"

      - name: Registry login
        run: |
          gcloud auth configure-docker "$GCP_REGION-docker.pkg.dev" --quiet
          echo "${{ github.token }}" | crane auth login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Verify signature and copy by digest
        run: |
          tools/verify-signature.sh "$IMAGE"
          ref=$(tools/copy-signed.sh "$IMAGE" "$GCP_REGION-docker.pkg.dev/$GCP_PROJECT/model-server/$SERVICE" "$VERSION")
          echo "TARGET=$ref" >> "$GITHUB_ENV"

      - name: Deploy revision (no traffic)
        run: |
          rev=$(tools/deploy.sh "$GCP_PROJECT" "$GCP_REGION" "$SERVICE" "$TARGET" "$VERSION" "$FAULT_ERROR_RATE" "$FAULT_LATENCY_MS")
          url=$(gcloud run services describe "$SERVICE" --project "$GCP_PROJECT" --region "$GCP_REGION" --format 'value(status.url)')
          echo "REVISION=$rev" >> "$GITHUB_ENV"
          echo "URL=$url" >> "$GITHUB_ENV"

      # A healthy release must not lose a single request. A degraded one (faults injected) must be
      # rolled back, with errors limited to roughly the 20% canary weight.
      - name: Canary under load
        run: |
          degraded=false
          if [[ $FAULT_ERROR_RATE != 0 || $FAULT_LATENCY_MS != 0 ]]; then degraded=true; fi
          k6_pid=
          if [[ ${{ inputs.load }} == true ]]; then
            MAX_ERROR_RATE=$([[ $degraded == true ]] && echo 0.15 || echo 0) tools/load.sh "$URL" 20 12m &
            k6_pid=$!
          fi

          set +e
          tools/canary.py --project "$GCP_PROJECT" --region "$GCP_REGION" --service "$SERVICE" --revision "$REVISION"
          canary_rc=$?
          k6_rc=0
          if [[ -n $k6_pid ]]; then wait "$k6_pid"; k6_rc=$?; fi
          set -e

          {
            echo "### $VERSION on ${{ inputs.environment }}"
            echo "- revision: \`$REVISION\`"
            echo "- image: \`$TARGET\`"
            echo "- canary exit: $canary_rc, k6 exit: $k6_rc, degraded: $degraded"
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ $degraded == true ]]; then
            [[ $canary_rc -eq 1 ]] || { echo "::error::degraded release was promoted"; exit 1; }
            [[ $k6_rc -eq 0 ]] || { echo "::error::blast radius above canary weight"; exit 1; }
            echo "degraded release rolled back automatically"
          else
            [[ $canary_rc -eq 0 ]] || { echo "::error::canary failed and was rolled back"; exit 1; }
            [[ $k6_rc -eq 0 ]] || { echo "::error::requests failed during the rollout"; exit 1; }
          fi

      - name: Upload k6 summary
        if: always() && inputs.load
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: k6-${{ inputs.environment }}-${{ inputs.version }}
          path: k6-results/
          if-no-files-found: ignore
