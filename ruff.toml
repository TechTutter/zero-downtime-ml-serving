line-length = 100
target-version = "py313"

[lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM"]
ignore = ["S311"] # random is used for fault injection, not crypto

[lint.per-file-ignores]
"**/tests/*" = ["S101"]
"tools/canary.py" = ["S603", "S607"] # gcloud from PATH with fixed arguments

[lint.isort]
known-first-party = ["model_server", "train", "canary"]
